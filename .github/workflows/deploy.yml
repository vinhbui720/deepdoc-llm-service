name: deploy bl4000
# Deploy remains manual until dedicated runner, unit migration, and rollback are verified.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bl4000-llm
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, bl4000]
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Deploy immutable commit
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: sh scripts/deploy.sh
